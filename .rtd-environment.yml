channels:
  - conda-forge
  - bioconda
dependencies:
  # docs specific packages
  - mock
  - sphinx
  - sphinx_bootstrap_theme

  # gimme packages (without the motif discovery tools)
  - biofluff >=3.0.4              # necessary for coverage_table()
  - configparser
  - diskcache
  - feather-format
  - genomepy >=0.16.4             # has no dependency on pkg_resources
  - iteround
  - jinja2
  - logomaker
  - loguru
  - matplotlib-base >=3.3         # https://matplotlib.org/stable/devel/min_dep_policy.html#list-of-dependency-versions
  - numpy >=1.18                  # https://numpy.org/neps/nep-0029-deprecation_policy.html#support-table
  - pandas >=1.3, <3
  - pybedtools >=0.9.0
  - pysam >=0.16
  - python >=3.9
  - python-xxhash
  - qnorm  >=0.8.1
  - scikit-learn >=0.23.2, <1.7   # v1.7 deprecated n_alphas
  - scipy >=1.5                   # https://docs.scipy.org/doc/scipy/dev/toolchain.html#numpy
  - seaborn >=0.10.1
  - statsmodels
  - tqdm >=4.46.1
  - xdg
